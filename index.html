<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#66ffdb">
  <meta name="description" content="Metiq — latihan matematika TK, SD, SMP, dan SMA (TK A sampai Kalkulus) dalam bahasa Indonesia, dengan dasbor guru dan laporan orang tua.">
  <title>Metiq — Matematika TK sampai SMA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=144">
  <link rel="stylesheet" href="css/duo.css?v=144">
  <link rel="icon" href="icons/icon.svg?v=144" type="image/svg+xml">
  <link rel="icon" href="icons/icon-192.png?v=144" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=144">
  <link rel="manifest" href="manifest.webmanifest?v=144">
  <meta name="apple-mobile-web-app-title" content="Metiq">
</head>
<body>
  <div id="app"></div>
  <script>
    // Bahasa dipilih sebelum aplikasi dimuat: ID memakai js/, EN memakai salinan js/en/ hasil tools/i18n/build.js
    (function () {
      var q = /[?&]lang=(en|id)\b/.exec(location.search), L = q && q[1];
      try { if (L) localStorage.setItem('metiq_lang', L); else L = localStorage.getItem('metiq_lang'); } catch (e) {}
      var en = L === 'en'; window.METIQ_LANG = en ? 'en' : 'id';
      if (en) {
        document.documentElement.lang = 'en'; document.title = 'Metiq — Math from Pre-K to High School';
        document.querySelector('meta[name=description]').content = 'Metiq — math practice from Pre-K through Calculus, with a teacher dashboard and parent reports.';
      }
      var plain = { config: 1, cloud: 1, sound: 1, avatars: 1, mascot: 1, 'jobs-vis': 1 };
      ['config', 'curriculum', 'kolom', 'pola', 'grade2', 'kit-upper', 'grade3', 'grade4', 'grade5', 'grade6', 'kit-hs', 'grade0', 'stories-tk', 'grade7', 'grade8', 'algebra1', 'geometry', 'algebra2', 'precalculus', 'calculus', 'pola-hs', 'olimpiade', 'iman-units', 'lessons-a', 'lessons-b', 'lessons-iman', 'avatars', 'sound', 'manual', 'games', 'jobs-vis', 'jobs', 'jobs-real', 'anim', 'store', 'cloud', 'iman', 'album', 'mascot', 'mascot-friends', 'en-fix', 'app'].forEach(function (f) {
        if (f === 'en-fix' && !en) return;
        document.write('<script src="js/' + (en && !plain[f] ? 'en/' : '') + f + '.js?v=144"><\/script>');
      });
    })();
  </script>
</body>
</html>
