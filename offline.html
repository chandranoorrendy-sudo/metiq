<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#66ffdb">
  <title>Metiq — Tidak ada internet</title>
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f1fbf8; color: #04382e; font: 700 1rem/1.5 Nunito, system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; }
    main { max-width: 360px; padding: 24px; }
    img { width: 96px; height: 96px; }
    h1 { margin: 14px 0 6px; font-size: 1.4rem; font-weight: 900; }
    p { margin: 0 0 8px; color: #4c6460; }
    a { display: inline-block; margin-top: 14px; padding: 12px 24px; border-radius: 14px; background: #35e0bd; border-bottom: 4px solid #19b796; color: #04382e; text-decoration: none; font-weight: 900; }
  </style>
</head>
<body>
  <!-- Ditampilkan service worker (sw.js) saat Metiq dibuka tanpa internet dan belum pernah tersimpan di HP ini -->
  <main>
    <img src="icons/icon.svg" alt="">
    <h1>Tidak ada internet</h1>
    <p>Sambungkan HP ke internet, lalu coba lagi. Kemajuan belajarmu tetap aman.</p>
    <p lang="en" style="font-size:.9rem">No internet connection. Connect and try again; your progress is safe.</p>
    <a href="./">Coba lagi</a>
  </main>
</body>
</html>
